name: Mirror verified RWKV7 G1i 2.9B checkpoint
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download model from official Hugging Face repository
        run: |
          set -euo pipefail
          python -m pip install --upgrade huggingface_hub
          mkdir -p pieces
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import shutil
          src=hf_hub_download(repo_id="BlinkDL/rwkv7-g1", filename="rwkv7-g1i-2.9b-20260805-ctx16384.pth")
          shutil.copyfile(src, "original.pth")
          PY
          sha256sum original.pth | tee pieces/ORIGINAL_SHA256SUMS
          split -b 1500M -d -a 3 original.pth pieces/rwkv7-g1i-2.9b-20260805-ctx16384.pth.part-
          sha256sum pieces/*.part-* > pieces/PARTS_SHA256SUMS
          printf '%s\n' "Source: https://huggingface.co/BlinkDL/rwkv7-g1" "Original filename: rwkv7-g1i-2.9b-20260805-ctx16384.pth" "Restore: cat rwkv7-g1i-2.9b-20260805-ctx16384.pth.part-* > original.pth" "Verify with ORIGINAL_SHA256SUMS." > pieces/RESTORE.txt
          rm original.pth
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create rwkv7-g1i-2.9b-original-20260805 --repo "${{ github.repository }}" --title "RWKV7 G1i 2.9B original weights (losslessly split)" --notes "Official source BlinkDL/rwkv7-g1; exact original SHA256 and each part SHA256 are included in the release." || true
          gh release upload rwkv7-g1i-2.9b-original-20260805 pieces/* --repo "${{ github.repository }}" --clobber
